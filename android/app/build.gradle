plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.novastudio.nova'
    compileSdk 35
    
    defaultConfig {
        applicationId "com.novastudio.nova"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        
        // NDK configuration
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        
        // Permissions
        manifestPlaceholders = [providerAuthority: "${applicationId}.fileprovider"]
    }
    
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            signingConfig signingConfigs.debug // Change to release config for Play Store
        }
        
        debug {
            debuggable true
            jniDebuggable true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    packagingOptions {
        // Don't strip native libraries
        doNotStrip "*/arm64-v8a/*.so"
        doNotStrip "*/armeabi-v7a/*.so"
        
        // Merge native libraries
        jniLibs {
            useLegacyPackaging = true
        }
        
        // Don't compress native libraries
        exclude '**/*.so'
    }
    
    // NOTE: no externalNativeBuild here — the native .so is already built by
    // Qt's CMake (build_android/) and androiddeployqt stages it into the APK.
    // The old standalone cpp/CMakeLists.txt is stale (Qt 6.6 paths) and unused.
    
    // Packaging for QML assets
    aaptOptions {
        noCompress "qml", "qmlc", "js", "json", "png", "svg"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.activity:activity-ktx:1.8.2"
    
    // Qt6 Android dependencies: NOT via Maven (androiddeployqt bundles Qt libs
    // directly into the APK). The org.qtproject.qt6 artifacts below do not
    // exist on Maven Central and break the build, so they stay removed.
    
    // Oboe for low-latency audio
    implementation "com.google.oboe:oboe:1.7.0"
    
    // Coroutines for async operations
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    
    // Room for local database (projects, settings)
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    
    // DataStore for settings
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    
    // WorkManager for background tasks
    implementation "androidx.work:work-runtime-ktx:2.9.0"
}

kapt {
    correctErrorTypes = true
}