plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.novastudio.nova'
    compileSdk 35
    
    defaultConfig {
        applicationId "com.novastudio.nova"
        minSdk 24
        targetSdk 35
        versionCode 10004
        versionName "1.0.4"
        
        // NDK configuration
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        
        // Permissions
        manifestPlaceholders = [providerAuthority: "${applicationId}.fileprovider"]
    }
    
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            signingConfig signingConfigs.debug // Change to release config for Play Store
        }
        
        debug {
            debuggable true
            jniDebuggable true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    // 🔒 El lint en release abortaba la build por avisos del propio codigo
    // (no por errores de compilacion). Se desactiva el lint del release.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    packagingOptions {
        // Don't strip native libraries
        doNotStrip "*/arm64-v8a/*.so"
        doNotStrip "*/armeabi-v7a/*.so"
        
        // Merge native libraries
        jniLibs {
            useLegacyPackaging = true
        }
        
        // Don't compress native libraries
        // (OJO: antes habia un 'exclude **/*.so' aqui, que excluia las
        // librerias nativas del APK en lugar de dejarlas sin comprimir:
        // el APK salia sin libnova_ui_qt ni las de Qt y no arrancaba.)
        // La falta de compresion la resuelve jniLibs.useLegacyPackaging.
    }
    
    // NOTE: no externalNativeBuild here — the native .so is already built by
    // androiddeployqt into android-build/libs/arm64-v8a/. Se añaden como
    // jniLibs para que el APK las traiga (sin esto el APK salia con las
    // librerias nativas de Qt y la app sin el motor).
    // OJO: este fichero NO lleva bloque externalNativeBuild a proposito. El
    // motor de audio lo compila CMake (CMakeLists.txt de la raiz, con Oboe por
    // FetchContent); Gradle solo empaqueta el .so que deja androiddeployqt.
    // Anadir externalNativeBuild aqui hace que Gradle invoque un CMake que no
    // existe y falle con "Could not find a package configuration file provided
    // by oboe". Ver AGENTS.md, seccion 3.
    sourceSets {
        main {
            // 🔒 Los RECURSOS de las librerías de Qt (res/values/libs.xml) los
            // escribe androiddeployqt en <staging>/res. Sin esta linea, Gradle
            // solo mira src/main/res y el APK sale sin esos recursos: QtLoader
            // busca "use_local_qt_libs" con getIdentifier(), no lo encuentra
            // (devuelve 0) y getString(0) lanza un Resources.NotFoundException
            // al abrir la app -> crash. Es el equivalente al res.srcDirs de la
            // plantilla de Qt (que apunta a qtAndroidDir+'/res' y a 'res':
            // aqui el modulo app esta un nivel mas abajo, asi que el res de Qt
            // esta en ../res y el de la app en src/main/res).
            res.srcDirs = ['../res', 'src/main/res']
            // 🔒 Los assets (el bundle RCC con el metadata de los módulos QML:
            // los qmldir de QtQuick, QtQuick.Controls, QtQuick.Window...)
            // los deja androiddeployqt en <proyecto>/assets. Sin esta linea,
            // Gradle no los empaqueta: el APK sale sin ellos y en el movil
            // "import QtQuick.Controls 2.15" no se puede resolver -> el QML
            // no carga -> main() devuelve -1 -> la app se cierra al abrirla.
            // La plantilla de Qt lo trae (assets.srcDirs = ['assets']); al
            // sustituirla por este build.gradle hay que reponerlo.
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['../libs']
        }
    }
    // Qt's CMake (build_android/) and androiddeployqt stages it into the APK.
    // El antiguo android/app/src/main/cpp/CMakeLists.txt era obsoleto (rutas de
    // Qt 6.6 y un find_package(oboe) imposible) y se elimino: era una trampa
    // para quien intentase compilar desde aqui.
    
    // Packaging for QML assets
    aaptOptions {
        noCompress "qml", "qmlc", "js", "json", "png", "svg"
    }
}

dependencies {
    // 🔒 Qt6 Android (org.qtproject.qt.android.*: QtActivity, QtService...):
    // androiddeployqt copia los jars de Qt en app/libs/ y se añaden aqui. Sin
    // ellos el codigo Java de la app (MainActivity, AudioForegroundService)
    // no compila: "package org.qtproject.qt.android does not exist".
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.activity:activity-ktx:1.8.2"
    
    // Qt6 Android dependencies: NOT via Maven (androiddeployqt bundles Qt libs
    // directly into the APK). The org.qtproject.qt6 artifacts below do not
    // exist on Maven Central and break the build, so they stay removed.
    
    // Oboe for low-latency audio
    implementation "com.google.oboe:oboe:1.7.0"
    
    // Coroutines for async operations
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    
    // DataStore for settings
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    
    // WorkManager for background tasks
    implementation "androidx.work:work-runtime-ktx:2.9.0"
}

kapt {
    correctErrorTypes = true
}