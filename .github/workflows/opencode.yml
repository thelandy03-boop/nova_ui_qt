name: OpenCode Assistant (Zen & Muse Spark)

# Corrección "Arreglo interno 3":
# - FIX HANG: el agente se congelaba esperando aprobación de permisos
#   (external_directory/doom_loop/question default "ask" en modo headless).
#   Se agregan: (a) bloque "permission" en opencode.json del repo,
#   (b) config global de respaldo escrito en ~/.config/opencode/opencode.json,
#   (c) timeout-minutes: 100 para fallar rápido si algo vuelve a atascarse,
#   (d) cancel-in-progress: true para que un comando humano nuevo cancele
#   un run zombie en vez de encolarse detrás de él para siempre.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  guard:
    name: Puerta anti-duplicados y anti-bots
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
      issue_number: ${{ steps.eval.outputs.issue_number }}
      is_pr: ${{ steps.eval.outputs.is_pr }}
      reason: ${{ steps.eval.outputs.reason }}
    steps:
      - name: Evaluar comando y autor
        id: eval
        shell: python3 {0}
        run: |
          import os, re

          event = os.environ.get("EVENT_NAME", "")
          actor = os.environ.get("ACTOR", "")
          sender_type = os.environ.get("SENDER_TYPE", "")
          comment_user_type = os.environ.get("COMMENT_USER_TYPE", "")
          issue_number = os.environ.get("ISSUE_NUMBER", "") or os.environ.get("PR_NUMBER", "")
          is_pr = os.environ.get("IS_PR", "false")
          title = os.environ.get("ISSUE_TITLE", "") or ""
          issue_body = os.environ.get("ISSUE_BODY", "") or ""
          comment_body = os.environ.get("COMMENT_BODY", "") or ""

          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{k}={v}\n")

          reason = ""
          should = False

          if sender_type == "Bot":
              reason = f"ignorado: sender '{actor}' es Bot"
          elif actor.endswith("[bot]") or actor == "github-actions[bot]":
              reason = f"ignorado: actor '{actor}' es bot"
          elif comment_user_type == "Bot":
              reason = "ignorado: autor del comentario es Bot"
          else:
              text = (title + "\n" + issue_body) if event == "issues" else comment_body
              text_nocode = re.sub(r"```.*?```", "", text, flags=re.DOTALL)
              valid = False
              for raw_line in text_nocode.splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith(">"):
                      continue
                  low = line
                  if low == "/oc" or low.startswith("/oc ") or low.startswith("/oc\t"):
                      valid = True
                      break
                  if low == "/opencode" or low.startswith("/opencode ") or low.startswith("/opencode\t"):
                      valid = True
                      break
              if valid:
                  should = True
                  reason = "comando humano válido a inicio de línea"
              else:
                  reason = "ignorado: sin comando /oc u /opencode a inicio de línea (se ignoran citas, código y texto corrido)"

          out("should_run", "true" if should else "false")
          out("issue_number", issue_number)
          out("is_pr", is_pr)
          out("reason", reason.replace("\n", " ")[:300])
          print(f"should_run={should} issue={issue_number} is_pr={is_pr} :: {reason}")
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_PR: ${{ contains(github.event.issue.pull_request, 'url') }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

  opencode-agent:
    name: OpenCode Agent (Muse Spark 1.3 Multimodal)
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    # (c) Si el agente vuelve a atascarse, el run falla a los 100 min en vez
    # de consumir las 6 h por defecto de GitHub y bloquear el grupo.
    timeout-minutes: 100
    # (d) Un comando humano nuevo cancela el run anterior del mismo issue
    # (antes se encolaba detrás de un run zombie para siempre).
    # La deduplicación por PR sigue protegiendo contra duplicados.
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write

    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------------------
      # RAMA BASE DINÁMICA
      #
      # El action de opencode (`opencode github run`) SIEMPRE crea el Pull
      # Request con base = rama por defecto del repo (`repo.default_branch`),
      # sin forma de cambiarlo por input, env var o flag. Lo que sí depende
      # del workflow es el punto de partida del agente: la rama que se hace
      # checkout es la base de la rama nueva `opencode/issueN-<ts>`.
      #
      # Por eso aquí se resuelve la rama que pidió el usuario y se hace
      # checkout de ella. Al final del run, el PR creado por el action se
      # reapunta a esa rama con `gh pr edit --base` (PATCH /pulls/{n}).
      # ---------------------------------------------------------------------
      - name: Resolver rama base solicitada
        id: base_branch
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH_FALLBACK: ${{ github.event.repository.default_branch }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}

        shell: python3 {0}
        run: |
          import os, re, subprocess

          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{k}={v}\n")

          repo = os.environ.get("REPO", "")
          token = os.environ.get("GH_TOKEN", "")

          def gh(args):
              env = dict(os.environ)
              if token:
                  env["GH_TOKEN"] = token
              try:
                  r = subprocess.run(["gh"] + args, capture_output=True, text=True,
                                     env=env, timeout=60)
              except Exception as e:
                  print(f"gh error: {e}")
                  return ""
              if r.returncode != 0:
                  print(f"gh {' '.join(args)} -> {r.returncode}: {r.stderr.strip()[:300]}")
                  return ""
              return r.stdout

          default_branch = gh(["api", f"repos/{repo}", "--jq", ".default_branch"]).strip()
          if not default_branch:
              default_branch = os.environ.get("DEFAULT_BRANCH_FALLBACK", "").strip()

          raw = gh(["api", "--paginate", f"repos/{repo}/branches?per_page=100", "--jq", ".[].name"])
          branches = sorted({line.strip() for line in raw.splitlines() if line.strip()})
          print(f"default_branch={default_branch}")
          print(f"branches={branches}")

          if not branches:
              # No se pudo consultar el remoto (token/red): no se fuerza ninguna
              # rama, se deja el checkout por defecto y el PR queda en la rama
              # por defecto como siempre.
              out("base_branch", "")
              out("default_branch", default_branch)
              out("base_source", "unresolved")
              out("base_warning", "no se pudieron listar las ramas del remoto")
              print("Sin lista de ramas: se usa la rama por defecto del checkout.")
              raise SystemExit(0)

          text = "\n".join([
              os.environ.get("ISSUE_TITLE", ""),
              os.environ.get("ISSUE_BODY", ""),
              os.environ.get("COMMENT_BODY", ""),
          ])

          # "rama X", "rama: X", "base: X", "branch X", "basado en la rama X"...
          EXPLICIT = re.compile(
              r"(?i)\b(?:base|rama|branch)\s*(?:de\s+|para\s+)?[:=]?\s*([A-Za-z0-9_][A-Za-z0-9_./-]*)"
          )

          known = None
          unknown = []
          for m in EXPLICIT.finditer(text):
              cand = m.group(1).rstrip(".,;:!?)]}'\"")
              if not cand:
                  continue
              if cand in branches:
                  known = cand
                  break
              # Solo se reporta como error lo que tiene forma de rama.
              if any(ch in cand for ch in "/-_.@"):
                  unknown.append(cand)

          base = default_branch
          source = "default"
          warning = ""

          if known:
              base = known
              source = "explicit"
          elif unknown:
              warning = (f"se pidió la rama '{unknown[0]}' pero no existe en el remoto; "
                         f"se usa '{default_branch}'")

          if source == "default":
              # Mención implícita: el texto nombra una rama que existe.
              hits = []
              for name in branches:
                  if name == default_branch:
                      continue
                  pat = re.compile(r"(?<![\w./-])" + re.escape(name) + r"(?![\w./-])")
                  if pat.search(text):
                      hits.append(name)
              if hits:
                  base = max(hits, key=len)
                  source = "implicit"

          out("base_branch", base)
          out("default_branch", default_branch)
          out("base_source", source)
          out("base_warning", warning.replace("\n", " ")[:300])
          print(f"base_branch={base} source={source} warning={warning or '-'}")

      - name: Checkout del código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          # La rama resuelta arriba es el punto de partida del agente:
          # de aquí sale la rama `opencode/issueN-<ts>` que luego se publica.
          ref: ${{ steps.base_branch.outputs.base_branch }}

      # El action de opencode valida los commits con `git rev-list <default>..<rama>`.
      # Si el checkout fue de otra rama, ese ref local no existe y el action cae
      # a un `fetch --depth=1` (que deja el repo shallow). Se crea el ref local
      # para que la comparación sea directa y sin efectos colaterales.
      - name: Preparar ref local de la rama por defecto
        if: steps.base_branch.outputs.base_branch != '' && steps.base_branch.outputs.base_branch != steps.base_branch.outputs.default_branch
        run: |
          set -uo pipefail
          DEFAULT="${{ steps.base_branch.outputs.default_branch }}"
          if git show-ref --verify --quiet "refs/remotes/origin/${DEFAULT}"; then
            git branch --force "$DEFAULT" "origin/${DEFAULT}" \
              || echo "::warning::No se pudo crear el ref local ${DEFAULT}; el action usará su fallback."
            echo "Ref local ${DEFAULT} listo."
          else
            echo "origin/${DEFAULT} no existe: se deja el checkout como está."
          fi

      - name: Configurar identidad de Git para el Agente
        run: |
          git config --global user.name "${{ github.repository_owner }}"
          git config --global user.email "${{ secrets.PAT_EMAIL }}"

      # ---------------------------------------------------------------------
      # (b) FIX HANG — Red de respaldo: config global headless. Aunque el
      # opencode.json del repo ya trae el bloque "permission", este archivo
      # garantiza que NINGÚN permiso quede en "ask" en el runner, sin importar
      # qué versión del config del repo se haya hecho checkout.
      # ---------------------------------------------------------------------
      - name: Configurar permisos headless de OpenCode (anti-hang)
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "allow",
              "external_directory": "allow",
              "doom_loop": "allow",
              "question": "allow",
              "bash": "allow",
              "edit": "allow",
              "write": "allow"
            }
          }
          EOF

      - name: Deduplicar PR abierto existente
        id: dedupe
        if: needs.guard.outputs.is_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Buscando PRs abiertos opencode/issue${ISSUE_NUMBER}-* ..."
          EXISTING=$(gh api "repos/${REPO}/pulls?state=open&per_page=100" --jq \
            "[.[] | select(.head.ref | startswith(\"opencode/issue${ISSUE_NUMBER}-\")) | {number, head: .head.ref}] | sort_by(.number) | reverse | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Ya existe el PR #$EXISTING para el issue #$ISSUE_NUMBER: se reutiliza y no se crea otro."
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "♻️ Ya existe el PR #$EXISTING para este pedido (run $RUN_ID). OpenCode trabajará sobre ese PR en lugar de abrir uno duplicado." || true
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Sin PR previo: se procede a crear uno."
          fi

      - name: Reaccionar al comentario (acuse de recibo)
        if: steps.dedupe.outputs.skip != 'true' && github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content='eyes' || true

      # REA (Reverse Engineer Anything) es un MCP local que corre con Node.
      # Exige Node 22.19+ (no funciona en Node 20), por eso el runtime del
      # agente sube a 22. El servidor se registra en opencode.json.
      - name: Configurar Node.js (Runtime oficial de OpenCode + REA)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # JADX headless es el motor que usa REA para APKs. Se cachea porque el
      # JAR pesa ~41 MB y se verifica contra el SHA-256 fijado por REA.
      - name: Cache de JADX para REA
        if: steps.dedupe.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/rea-android
          key: rea-jadx-${{ runner.os }}-0.7.1

      - name: Preparar REA + JADX (análisis estático de APK)
        if: steps.dedupe.outputs.skip != 'true'
        # Si falla la descarga, el agente sigue trabajando sin REA.
        continue-on-error: true
        env:
          REA_VERSION: 6.7.0
          JADX_VERSION: 0.7.1
          JADX_SHA256: 6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75
        run: |
          set -euo pipefail
          DIR="$HOME/.cache/rea-android"
          JAR="$DIR/jadx-headless-mcp-${JADX_VERSION}-all.jar"
          mkdir -p "$DIR"
          if [ ! -f "$JAR" ]; then
            curl -fL --retry 3 --retry-delay 2 -o "$JAR" \
              "https://github.com/1013503897/jadx-headless-mcp/releases/download/v${JADX_VERSION}/jadx-headless-mcp-${JADX_VERSION}-all.jar"
          fi
          echo "${JADX_SHA256}  ${JAR}" | sha256sum -c -
          echo "REA_JADX_MCP_JAR=$JAR" >> "$GITHUB_ENV"
          # Precalienta el caché de npx para que el primer tools/list del MCP
          # no agote el timeout de arranque (el paquete se baja una sola vez).
          npx -y "rea-agents@${REA_VERSION}" --help >/dev/null
          npx -y "rea-agents@${REA_VERSION}" doctor || true

      - name: Resolver Prompt y Descargar Imágenes para OpenCode Multimodal
        id: prompt_resolver
        if: steps.dedupe.outputs.skip != 'true'
        shell: python3 {0}
        run: |
          import os, re, urllib.request, mimetypes

          event_name = os.environ.get("EVENT_NAME", "")
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")
          comment_body = os.environ.get("COMMENT_BODY", "")

          if event_name == "issues":
              raw_prompt = issue_title
              if issue_body:
                  raw_prompt += "\n\n" + issue_body
              if not raw_prompt.strip():
                  raw_prompt = "Revisa y resuelve el issue solicitado."
          else:
              raw_prompt = comment_body
              if not raw_prompt.strip():
                  raw_prompt = "Revisa y responde al comentario solicitado."

          img_pattern = re.compile(
              r'https?://(?:github\.com/user-attachments/assets/[a-zA-Z0-9_\-]+|user-images\.githubusercontent\.com/[^\s\)\"\'>]+|[^\s\)\"\'>]+\.(?:png|jpg|jpeg|webp|gif|svg)(?:\?[^\s\)\"\'>]*)?)',
              re.IGNORECASE
          )

          found_urls = img_pattern.findall(raw_prompt)
          seen = set()
          unique_urls = []
          for u in found_urls:
              if u not in seen:
                  seen.add(u)
                  unique_urls.append(u)

          downloaded_images = []
          if unique_urls:
              os.makedirs(".opencode/attachments", exist_ok=True)
              for idx, url in enumerate(unique_urls, 1):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0 (GitHubActions-OpenCodeAgent/1.0)"}
                      )
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          data = resp.read()
                          content_type = resp.headers.get_content_type()
                          ext = mimetypes.guess_extension(content_type) or ".png"
                          if ext == ".jpe":
                              ext = ".jpg"
                          local_path = f".opencode/attachments/imagen_{idx}{ext}"
                          with open(local_path, "wb") as f:
                              f.write(data)
                          downloaded_images.append((local_path, url))
                          print(f"✅ Imagen {idx} descargada exitosamente: {local_path} ({len(data)} bytes)")
                  except Exception as e:
                      print(f"⚠️ No se pudo descargar la imagen {url}: {e}")

          final_prompt = raw_prompt

          # Contexto de rama base: el HEAD ya está en esa rama y el PR se
          # publicará con base = esa rama.
          base_branch = os.environ.get("BASE_BRANCH", "")
          base_source = os.environ.get("BASE_SOURCE", "")
          base_warning = os.environ.get("BASE_WARNING", "")
          if base_branch:
              final_prompt += (
                  "\n\n---\n🌿 [CONTEXTO DE RAMA BASE]:\n"
                  f"- La rama base de este trabajo es `{base_branch}`"
                  f" (origen: {base_source}).\n"
                  f"- El workspace ya está posicionado en `{base_branch}`: "
                  "trabaja sobre ese código, NO te cambies a la rama por defecto "
                  "y NO crees ramas adicionales.\n"
                  f"- El Pull Request de este trabajo se abrirá con base = `{base_branch}`.\n"
              )
              if base_warning:
                  final_prompt += f"- ⚠️ Aviso del workflow: {base_warning}\n"

          if downloaded_images:
              final_prompt += "\n\n---\n📸 [IMÁGENES / CAPTURAS ADJUNTAS DISPONIBLES LOCALMENTE]:\n"
              final_prompt += "El usuario adjuntó las siguientes imágenes en el issue/comentario. Están descargadas localmente en el repositorio para tu análisis visual:\n"
              for path, url in downloaded_images:
                  final_prompt += f"- Archivo local: `{path}` (URL original: {url})\n"
              final_prompt += "\nPor favor, utiliza tus herramientas de lectura y capacidades multimodales para revisar los archivos de imagen adjuntos, extraer detalles visuales, layouts o mensajes de error, y tenerlos en cuenta en tu respuesta e implementación de código.\n---"

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write("resolved_prompt<<EOF\n")
                  f.write(final_prompt + "\n")
                  f.write("EOF\n")
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          BASE_BRANCH: ${{ steps.base_branch.outputs.base_branch }}
          BASE_SOURCE: ${{ steps.base_branch.outputs.base_source }}
          BASE_WARNING: ${{ steps.base_branch.outputs.base_warning }}

      - name: Ejecutar OpenCode CLI con Muse Spark 1.3
        if: steps.dedupe.outputs.skip != 'true'
        uses: anomalyco/opencode/github@latest
        with:
          use_github_token: true
          model: "opencode/minimax-m3.1-flash-free"
          prompt: ${{ steps.prompt_resolver.outputs.resolved_prompt }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PROMPT: ${{ steps.prompt_resolver.outputs.resolved_prompt }}
          # Alternativa si prefieres NO tocar el opencode.json del repo:
          # esta variable inyecta el config completo inline solo en el runner.
          # OPENCODE_CONFIG_CONTENT: '{"permission":{"*":"allow","external_directory":"allow","doom_loop":"allow","question":"allow"}}'
          GIT_AUTHOR_NAME: ${{ github.repository_owner }}
          GIT_AUTHOR_EMAIL: ${{ secrets.PAT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ github.repository_owner }}
          GIT_COMMITTER_EMAIL: ${{ secrets.PAT_EMAIL }}

      # ---------------------------------------------------------------------
      # REAPUNTAR EL PR A LA RAMA BASE
      #
      # `opencode github run` crea el PR con base = rama por defecto del repo.
      # Como el agente trabajó sobre la rama resuelta arriba, el PR se
      # reapunta con `gh pr edit --base` (PATCH /repos/{repo}/pulls/{n}).
      # Solo aplica cuando el action creó el PR en este run (evento de issue);
      # en un PR ya existente manda la base que eligió el humano.
      # ---------------------------------------------------------------------
      - name: Apuntar el Pull Request a la rama base solicitada
        if: always() && steps.dedupe.outputs.skip != 'true' && needs.guard.outputs.is_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          BASE_BRANCH: ${{ steps.base_branch.outputs.base_branch }}
          DEFAULT_BRANCH: ${{ steps.base_branch.outputs.default_branch }}
        run: |
          set -uo pipefail
          if [ -z "$BASE_BRANCH" ] || [ "$BASE_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "Sin reapuntar: la rama base es la rama por defecto ($DEFAULT_BRANCH)."
            exit 0
          fi
          PR=$(gh api "repos/${REPO}/pulls?state=open&per_page=100" --jq \
            "[.[] | select(.head.ref | startswith(\"opencode/issue${ISSUE_NUMBER}-\"))] | sort_by(.number) | reverse | .[0].number // empty")
          if [ -z "$PR" ]; then
            echo "No hay PR del agente para el issue #${ISSUE_NUMBER}: nada que reapuntar."
            exit 0
          fi
          CURRENT=$(gh api "repos/${REPO}/pulls/${PR}" --jq .base.ref)
          if [ "$CURRENT" = "$BASE_BRANCH" ]; then
            echo "El PR #${PR} ya apunta a ${BASE_BRANCH}."
            exit 0
          fi
          if gh pr edit "$PR" --repo "$REPO" --base "$BASE_BRANCH"; then
            echo "PR #${PR} reapuntado de ${CURRENT} a ${BASE_BRANCH}."
          else
            echo "::warning::No se pudo reapuntar el PR #${PR} de ${CURRENT} a ${BASE_BRANCH}. Revisa el PR manualmente."
          fi
