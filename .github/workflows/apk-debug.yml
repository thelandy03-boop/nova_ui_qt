name: APK Debug

# Compila el proyecto entero y produce un APK **Debug** listo para instalar.
#
# Manual y solo manual: `workflow_dispatch` no se dispara con commits ni con
# pull requests. La cache de Qt para Android es opcional (boton "cache" en la
# pestana de ejecucion manual).
#
# OJO: el motor de audio lo compila CMake, NO Gradle. El flujo es:
#
#   qt-cmake        -> libnova_ui_qt_<abi>.so   (todo el C++, incluido el motor)
#   androiddeployqt -> staging de Gradle
#   gradlew         -> solo empaqueta el .so en el APK
#
# Por eso este workflow no compila el nativo con Gradle: llama a
# build_android.sh, que es el unico camino valido. Ver AGENTS.md.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI del APK"
        type: choice
        options:
          - arm64-v8a
          - x86_64
        default: arm64-v8a
      cache:
        description: "Usar la cache de Qt para Android (mas rapido la segunda vez)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  apk-debug:
    name: APK Debug (${{ inputs.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      QT_VERSION: "6.8.3"
      ANDROID_NDK_VERSION: "26.1.10909125"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17 (obligatorio para AGP 8 / Qt 6.8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (ya viene en el runner)
        # OJO: NO se usa android-actions/setup-android: su version actual
        # llama a `sdkmanager tools`, y ese paquete ya no existe en el
        # repositorio del SDK (falla con "Failed to find package 'tools'").
        # El runner de ubuntu ya trae el SDK con las cmdline-tools.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"

          SDKMANAGER="${SDK}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "SDKMANAGER=${SDKMANAGER}" >> "$GITHUB_ENV"
          echo "Usando sdkmanager: ${SDKMANAGER}"

          # Aceptar las licencias: si no, la instalacion del NDK se para.
          yes | timeout 120 "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true

          "${SDKMANAGER}" --install \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-31" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          # El runner trae un NDK preinstalado (27.x) en ANDROID_NDK_ROOT, pero
          # el CMakeLists pide el 26.1.10909125. Sin esto, el toolchain que
          # usa CMake no es el que se quiere.
          echo "ANDROID_NDK_ROOT=${SDK}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Python (aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache de Qt para Android
        if: inputs.cache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ env.QT_VERSION }}-android-${{ inputs.abi }}-${{ runner.os }}
          restore-keys: |
            qt-${{ env.QT_VERSION }}-android-${{ inputs.abi }}-

      - name: Instalar Qt para Android
        # OJO: para Android el "arch" de aqtinstall es el nombre del
        # subdirectorio por arquitectura (android_arm64_v8a), NO linux_gcc_64.
        # Con linux_gcc_64 aqt da 404 y el build no llega ni a empezar.
        # El Qt de escritorio hace falta aparte: trae androiddeployqt.
        run: |
          python3 -m pip install --upgrade aqtinstall
          AQT_ANDROID_ARCH="android_$(echo '${{ inputs.abi }}' | tr '-' '_')"
          aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 -O "$HOME/Qt"
          aqt install-qt linux android "${QT_VERSION}" "${AQT_ANDROID_ARCH}" -O "$HOME/Qt"
          ls -d "$HOME/Qt/${QT_VERSION}"/android_*

      - name: Cache de Gradle
        if: inputs.cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build_android.sh') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Compilar el APK Debug
        run: ./build_android.sh --abi "${{ inputs.abi }}" --debug

      - name: Comprobar el APK
        run: |
          set -uo pipefail
          APK="apks/NovaStudio-${{ inputs.abi }}-debug.apk"
          if [ ! -f "${APK}" ]; then
            echo "::error::No se genero ${APK}"
            ls -la apks/ || true
            exit 1
          fi
          echo "APK: $(du -h "${APK}" | cut -f1)"
          TOTAL=$(unzip -l "${APK}" | grep -cE "lib/${{ inputs.abi }}/.*\.so$")
          echo "--- .so nativas en lib/${{ inputs.abi }}/: ${TOTAL} ---"
          unzip -l "${APK}" | grep -E "lib/${{ inputs.abi }}/.*\.so$" | tail -5
          SO="lib/${{ inputs.abi }}/libnova_ui_qt_${{ inputs.abi }}.so"
          if unzip -l "${APK}" | grep -q "${SO}$"; then
            SIMBOLOS=$(unzip -p "${APK}" "${SO}" | strings | grep -cE "NovaAudioPlayer|NovaWavReader|NovaResampler" || true)
            echo "--- simbolos del motor de audio en el .so: ${SIMBOLOS} ---"
            if [ "${SIMBOLOS}" -eq 0 ]; then
              echo "::error::El .so del APK no tiene el motor de audio: el APK se empaqueto con un binario viejo"
              exit 1
            fi
          else
            echo "::error::El APK no trae ${SO}"
            exit 1
          fi

          # El bundle RCC con el metadata de los modulos QML (los qmldir).
          # Sin el, en el movil "import QtQuick.Controls" no resuelve, el QML
          # no carga y la app se cierra al abrirla.
          if unzip -l "${APK}" | grep -q "assets/android_rcc_bundle.rcc"; then
            echo "--- bundle RCC de los modulos QML: presente ---"
          else
            echo "::error::El APK no lleva assets/android_rcc_bundle.rcc: en el movil el QML no va a cargar"
            exit 1
          fi

          # 🔒 Lo que hacia que la app se cerrara al abrirla en el movil. Las
          # tres cosas se comprueban sobre el APK ya empaquetado: el recurso de
          # las librerias de Qt, el nombre de la libreria nativa en el manifest
          # y el permiso del servicio en primer plano.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2="${SDK}/build-tools/35.0.0/aapt2"
          if [ ! -x "${AAPT2}" ]; then
            AAPT2="$(find "${SDK}/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)"
          fi
          if [ ! -x "${AAPT2}" ]; then
            echo "::error::No se encuentra aapt2 en ${SDK}/build-tools"
            exit 1
          fi

          # 1) Los recursos de las librerias de Qt (res/values/libs.xml). QtLoader
          #    los busca con getIdentifier(): si no estan, getString(0) lanza un
          #    Resources.NotFoundException al abrir la app. aapt2 los compila
          #    dentro de la tabla de recursos (resources.arsc), asi que no se
          #    ven con unzip: hay que mirar la tabla.
          RECURSOS="$("${AAPT2}" dump resources "${APK}")"
          if grep -q "string/use_local_qt_libs" <<< "${RECURSOS}"; then
            echo "--- recursos de las librerias de Qt (libs.xml): presentes ---"
          else
            echo "::error::El APK no lleva los recursos de las librerias de Qt (res/values/libs.xml): QtLoader no encontrara 'use_local_qt_libs' y la app reventara al abrirla"
            exit 1
          fi

          # 2) El manifest que usa AGP (no el que parchea androiddeployqt, que
          #    AGP ignora) tiene que declarar el nombre de la libreria nativa:
          #    QtLoader lo lee y le anade el ABI (libnova_ui_qt_arm64-v8a.so).
          MANIFEST="$("${AAPT2}" dump xmltree --file AndroidManifest.xml "${APK}")"
          if grep -q "android.app.lib_name" <<< "${MANIFEST}" \
             && grep -qE 'android:value\(0x[0-9a-f]+\)="nova_ui_qt"' <<< "${MANIFEST}"; then
            echo "--- nombre de la libreria nativa (android.app.lib_name): presente ---"
          else
            echo "::error::El manifest del APK no declara android.app.lib_name=nova_ui_qt: Qt no encontrara la libreria y la app se cerrara al abrirla"
            exit 1
          fi

          # 3) El servicio en primer plano arranca con el tipo mediaPlayback
          #    (0x2): sin el permiso FOREGROUND_SERVICE_MEDIA_PLAYBACK, en
          #    Android 14+ startForeground() es un SecurityException que mata
          #    la app. El tipo microphone (0x40) NO debe estar: exige
          #    RECORD_AUDIO concedido y no se pide al abrir la app.
          if ! grep -q "FOREGROUND_SERVICE_MEDIA_PLAYBACK" <<< "${MANIFEST}"; then
            echo "::error::El manifest del APK no declara FOREGROUND_SERVICE_MEDIA_PLAYBACK: startForeground() con el tipo mediaPlayback sera un SecurityException en Android 14+"
            exit 1
          fi
          if ! grep -qE "foregroundServiceType\(0x[0-9a-f]+\)=0x00000002" <<< "${MANIFEST}"; then
            echo "::error::El servicio en primer plano del APK no declara el tipo mediaPlayback (0x2)"
            exit 1
          fi
          echo "--- servicio en primer plano: tipo mediaPlayback con su permiso ---"

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaStudio-debug-${{ inputs.abi }}
          path: apks/NovaStudio-${{ inputs.abi }}-debug.apk
          if-no-files-found: error
