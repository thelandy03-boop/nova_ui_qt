name: Android Debug APK

# ===========================================================================
# APARTE: este workflow es EXCLUSIVAMENTE MANUAL.
#
#   - El unico disparador es `workflow_dispatch`. No hay `push`, ni
#     `pull_request`, ni `schedule`, ni `workflow_call`: ningun commit ni
#     ningun PR lo enciende. Se arranca a mano desde
#     Actions -> Android Debug APK -> Run workflow.
#   - La cache (Qt, SDK de Android y Gradle) esta APAGADA por defecto. Se
#     activa marcando la casilla "use_cache" en el formulario del disparo
#     manual.
#   - Lo que compila es la rama `feature/nova-android-spike` (o el ref que
#     se indique en el formulario) y el resultado es un APK **Debug**.
# ===========================================================================
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama (o ref) del codigo que se compila"
        type: string
        default: "feature/nova-android-spike"
      abi:
        description: "ABI del APK: arm64-v8a (telefonos) o x86_64 (Waydroid/emulador)"
        type: choice
        options:
          - arm64-v8a
          - x86_64
        default: arm64-v8a
      use_cache:
        description: "Usar la cache (Qt, SDK de Android y Gradle). Desactivada por defecto."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ inputs.ref }}-${{ inputs.abi }}
  cancel-in-progress: false

jobs:
  apk-debug:
    name: "APK Debug"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # ABI que se compila y sus equivalente en el kit de Qt.
      ABI: ${{ inputs.abi }}
      QT_ARCH: ${{ inputs.abi == 'arm64-v8a' && 'android_arm64_v8a' || 'android_x86_64' }}
      # Version de Qt para Android (la misma que usa build_android.sh).
      QT_VERSION: "6.8.3"
      QT_DIR: ${{ github.workspace }}/Qt
      # Toolchain de Android: el NDK que fija CMakeLists.txt/gradle.properties.
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_NDK_VERSION: "26.1.10909125"
      ANDROID_PLATFORM: "android-31"
      ANDROID_COMPILE_SDK: "35"
      BUILD_TOOLS_VERSION: "35.0.0"
      # Directorios de trabajo de la compilacion.
      BUILD_DIR: build_android
      STAGING_DIR: build_android/android-build

    steps:
      - name: "Checkout del codigo"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: "Liberar espacio del runner"
        run: |
          # El runner trae un SDK de Android con varios NDK que aqui no se
          # usan (el workflow instala el suyo). Fuera, que ocupa unos 4 GB.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: "JDK 17 (el que piden Qt 6.8 y AGP 8)"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------------
      # Caches: todas gated por el interruptor "use_cache" del disparo
      # manual. Con la cache apagada el run es totalmente limpio.
      # ------------------------------------------------------------------
      - name: "Cache del SDK de Android (opcional)"
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-sdk${{ env.ANDROID_COMPILE_SDK }}-bt${{ env.BUILD_TOOLS_VERSION }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: "Cache de Gradle (opcional)"
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/.android
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Oboe (FetchContent) no se cachea a proposito: su directorio de
      # compilacion lleva rutas absolutas y un CMakeCache que se rompen si
      # el runner cambia de version de CMake. Su clon son unos segundos.

      - name: "Instalar el SDK de Android, el NDK y las build-tools"
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$RUNNER_TEMP"
          curl -fsSL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
             "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: "Instalar Qt ${{ env.QT_VERSION }} para Android (${{ env.QT_ARCH }})"
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: ${{ env.QT_ARCH }}
          dir: ${{ env.QT_DIR }}
          # La cache de Qt la activa el mismo interruptor del formulario.
          cache: ${{ inputs.use_cache }}

      - name: "Contratos del proyecto (QML, spike y script de build)"
        run: |
          set -euo pipefail
          python3 tests/check_qml_contract.py
          python3 tests/check_spike_contract.py
          python3 tests/check_android_build_script.py

      - name: "Configurar la compilacion nativa (CMake + Qt, Debug)"
        run: |
          set -euo pipefail
          QT_KIT="$QT_DIR/$QT_VERSION/$QT_ARCH"
          # Qt de Android es un kit cruzado: las herramientas de host (moc, rcc,
          # uic, androiddeployqt) estan en el Qt de escritorio que instala
          # install-qt-action en paralelo (gcc_64).
          QT_HOST="${{ steps.qt.outputs.qt-host-path }}"
          if [ ! -d "$QT_HOST" ]; then
            QT_HOST="$QT_DIR/$QT_VERSION/gcc_64"
          fi
          echo "Qt host: $QT_HOST"
          echo "QT_HOST_PATH=$QT_HOST" >> "$GITHUB_ENV"
          "$QT_KIT/bin/qt-cmake" -B "$BUILD_DIR" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" \
            -DQT_HOST_PATH="$QT_HOST" \
            -DCMAKE_AUTOMOC_EXECUTABLE="$QT_HOST/libexec/moc"

      - name: "Compilar todo el codigo nativo (Debug)"
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target nova_ui_qt -j"$(nproc)"

      - name: "Preparar el proyecto de Android (staging de Gradle)"
        run: |
          set -euo pipefail
          # El target `apk` de Qt hace dos cosas: generar el staging de Gradle
          # (android-build) y lanzar Gradle. La parte de Gradle falla porque
          # Qt 6.8 escribe un flag que AGP 8.1+ elimino
          # (android.bundle.enableUncompressedNativeLibs); el staging se
          # arregla en el paso siguiente y se empaqueta con assembleDebug.
          set +e
          cmake --build "$BUILD_DIR" --target apk -j"$(nproc)"
          codigo=$?
          set -e
          echo "::notice::El target 'apk' de Qt termino con el codigo $codigo (el empaquetado real se hace en el paso siguiente)."
          if [ ! -f "$STAGING_DIR/app/build.gradle" ]; then
            echo "::error::No se genero el staging de Gradle en $STAGING_DIR"
            exit 1
          fi

      - name: "Empaquetar el APK Debug (Gradle)"
        run: |
          set -euo pipefail
          proyecto="$GITHUB_WORKSPACE"
          cd "$STAGING_DIR"
          # 1) Fuera el flag que AGP 8.1+ elimino (lo escribe Qt 6.8).
          sed -i '/android.bundle.enableUncompressedNativeLibs/d' gradle.properties
          # 2) El lint y el aviso de source/target de Java no son errores.
          echo "android.lint.vital=false" >> gradle.properties
          echo "android.lint.abortOnError=false" >> gradle.properties
          echo "android.javaCompile.suppressSourceTargetDeprecationWarning=true" >> gradle.properties
          # 3) Gradle 8+ exige pluginManagement en settings.gradle.
          cp "$proyecto/android/settings.gradle" settings.gradle
          # 4) El modulo app necesita su manifest.
          mkdir -p app/src/main
          cp "$proyecto/android/app/src/main/AndroidManifest.xml" app/src/main/AndroidManifest.xml
          # 5) Los jars de Qt (org.qtproject.qt.android.*) van en app/libs/:
          #    sin ellos el Java de la app no compila.
          mkdir -p app/libs
          cp -f "$QT_DIR/$QT_VERSION/$QT_ARCH/jar/"*.jar app/libs/
          # 6) En el APK solo debe viajar el ABI elegido.
          sed -i "s|abiFilters.*|abiFilters '$ABI'|" app/build.gradle
          sed -i "s|doNotStrip .*|doNotStrip \"*/$ABI/*.so\"|" app/build.gradle
          # 7) Y ahora si: el APK Debug.
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: "Recoger el APK"
        run: |
          set -euo pipefail
          apk="$STAGING_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::No se genero el APK Debug en $apk"
            exit 1
          fi
          mkdir -p apks
          cp "$apk" "apks/NovaStudio-$ABI-debug.apk"
          ls -lh apks/
          sha256sum "apks/NovaStudio-$ABI-debug.apk" | tee apks/sha256sum.txt

      - name: "Subir el APK"
        uses: actions/upload-artifact@v4
        with:
          name: NovaStudio-${{ inputs.abi }}-debug-apk
          path: apks/NovaStudio-${{ inputs.abi }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: "Resumen"
        run: |
          {
            echo "### APK Debug de NOVA Studio"
            echo ""
            echo "- Rama: \`${{ inputs.ref }}\`"
            echo "- ABI: \`${{ inputs.abi }}\`"
            echo "- APK: \`apks/NovaStudio-$ABI-debug.apk\` ($(du -h "apks/NovaStudio-$ABI-debug.apk" | cut -f1))"
            echo "- Cache: \`${{ inputs.use_cache }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
